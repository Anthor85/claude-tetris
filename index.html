<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema claro/oscuro"></button>
    <select id="skin-select" aria-label="Elegir skin" title="Elegir skin">
      <option value="retro">Retro</option>
      <option value="neon">Neón</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section" id="mode-section">
          <span class="label">MODO</span>
          <span class="power-name" id="mode-name"></span>
        </div>

        <div class="panel-section hidden" id="time-section">
          <span class="label">TIEMPO</span>
          <span class="value" id="time">2:00</span>
        </div>

        <div class="panel-section hidden" id="goal-section">
          <span class="label">OBJETIVO</span>
          <span class="power-name" id="goal">0/40 líneas</span>
        </div>

        <div class="panel-section hidden" id="garbage-section">
          <span class="label">BASURA EN</span>
          <span class="power-name" id="garbage-timer">10s</span>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section" id="power-section">
          <span class="label">POWER-UP</span>
          <span class="value" id="power-icon">—</span>
          <span class="power-name" id="power-name"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div class="overlay-buttons">
          <button id="restart-btn">Reiniciar</button>
          <button id="menu-btn">Menú</button>
        </div>
      </div>
    </div>

    <div id="menu" class="overlay menu">
      <div class="menu-box">
        <p class="menu-title">ELIGE MODO</p>
        <button class="mode-btn" data-mode="normal">
          <span class="mode-btn-name">Normal</span>
          <span class="mode-desc">Tetris clásico con power-ups</span>
        </button>
        <button class="mode-btn" data-mode="time">
          <span class="mode-btn-name">Tiempo</span>
          <span class="mode-desc">Limpia 40 líneas en 2 minutos</span>
        </button>
        <button class="mode-btn" data-mode="garbage">
          <span class="mode-btn-name">Basura</span>
          <span class="mode-desc">Cada 10s sube una fila desde abajo</span>
        </button>
        <button class="mode-btn" data-mode="math">
          <span class="mode-btn-name">Ataque matemático</span>
          <span class="mode-desc">5% de piezas en forma de + (5 bloques)</span>
        </button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
